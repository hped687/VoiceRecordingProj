<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Voice Recorder</title>
<script src="lib/WebAudioRecorder.js"></script>
<style>
body { font-family: sans-serif; padding: 2em; }
button { font-size: 1.2em; padding: 0.5em 1em; }
#status-msg { margin-top: 1em; font-weight: bold; }

#recording-indicator {
  display: none;
  align-items: center;
  margin-bottom: 1em;
}

.blinking-dot {
  height: 12px;
  width: 12px;
  background-color: red;
  border-radius: 50%;
  display: inline-block;
  margin-right: 8px;
  animation: blink 1s infinite;
}

@keyframes blink {
  0% { opacity: 1; }
  50% { opacity: 0; }
  100% { opacity: 1; }
}
</style>
</head>
<body>

<!-- Blinking red dot indicator -->
<div id="recording-indicator">
  <div class="blinking-dot"></div>
  <span>Recording...</span>
</div>

<!-- Record button -->
<button id="record-btn">Start Recording</button>
<p id="status-msg"></p>

<script>
let gumStream, recorder, audioCtx;
let participantId = "anon";
let questionId = "unknown_question";
let recordingPrompt = "";
let currentduration = 10;   // default only; Qualtrics sends the real value
let isRecording = false;
let hasSentStartTimer = false;

const recordBtn = document.getElementById("record-btn");
const statusMsg = document.getElementById("status-msg");
const recordingIndicator = document.getElementById("recording-indicator");

function showRecordingIndicator() { recordingIndicator.style.display = "flex"; }
function hideRecordingIndicator() { recordingIndicator.style.display = "none"; }

// Tell parent iframe is ready
window.parent.postMessage({ type: "iframe-ready" }, "*");

window.addEventListener("message", (event) => {
  if (!event.data || typeof event.data !== "object") return;
  const { pid, qid, prompt, type, duration } = event.data;
  console.log("Received message from parent:", event.data);

  if (pid) participantId = pid;
  if (qid) questionId = qid;
  if (prompt) recordingPrompt = prompt;

  // Duration comes with the prompt message from Qualtrics.
  // Only accept it before recording starts, so the limit can't change mid-recording.
  const d = Number(duration);
  if (duration !== undefined && d > 0 && !isRecording) {
    currentduration = d;
    console.log("Duration set to:", currentduration);
  }

  if (type === "stop-recording") {
    stopRecording("Qualtrics timer");
  }
});

// One stop function used by the button, the recorder's time limit, and Qualtrics.
// Safe to call more than once.
function stopRecording(reason) {
  if (!isRecording) return;
  isRecording = false;
  console.log("⏹️ Stopping recording:", reason);

  try {
    recorder.finishRecording();
  } catch (err) {
    console.error("finishRecording error:", err);
  }
  if (gumStream) gumStream.getTracks().forEach((t) => t.stop());
  if (audioCtx) audioCtx.close().catch(() => {});

  recordBtn.innerText = "Recording Finished";
  recordBtn.disabled = true;
  hideRecordingIndicator();

  window.parent.postMessage({ type: "stop-timer" }, "*");
  hasSentStartTimer = false;
}

recordBtn.onclick = async function () {
  if (isRecording) {
    stopRecording("button");
    return;
  }
  if (recordBtn.innerText !== "Start Recording") return;

  try {
    recordBtn.disabled = true; // prevent double-clicks while the mic starts
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    gumStream = stream;
    audioCtx = new AudioContext();
    const input = audioCtx.createMediaStreamSource(stream);

    recorder = new WebAudioRecorder(input, {
      workerDir: "lib/",
      encoding: "wav",
      numChannels: 1,
      onEncoderLoading: () => (statusMsg.innerText = "Loading encoder..."),
      onEncoderLoaded: () => (statusMsg.innerText = "Encoder ready. Recording..."),
    });

    recorder.setOptions({
      timeLimit: currentduration,
      encodeAfterRecord: true,
    });

    // When the time limit is reached, clean up properly (mic, button, parent timer)
    recorder.onTimeout = function () {
      stopRecording("time limit (" + currentduration + "s)");
    };

    recorder.onComplete = function (rec, blob) {
      statusMsg.innerText = "Recording complete. Uploading...";

      const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
      const filename = `${participantId}_${questionId}_${timestamp}.wav`;

      const formData = new FormData();
      formData.append("file", blob, filename);

      fetch("https://qualtrics-audio-upload.onrender.com/upload", {
        method: "POST",
        body: formData,
      })
        .then((res) => {
          if (!res.ok) throw new Error("Server responded " + res.status);
          statusMsg.innerText = "✅ Uploaded successfully!";
        })
        .catch((error) => {
          statusMsg.innerText = "❌ Upload failed.";
          console.error("Upload error:", error);
        });
    };

    recorder.onError = function (rec, err) {
      statusMsg.innerText = "⚠️ Recording error.";
      console.error("Recorder error:", err);
    };

    recorder.startRecording();
    isRecording = true;

    recordBtn.innerText = "Stop Recording";
    recordBtn.disabled = false;
    showRecordingIndicator();

    if (!hasSentStartTimer) {
      console.log("👉 Sending start-timer to parent with duration:", currentduration);
      window.parent.postMessage({ type: "start-timer", duration: currentduration }, "*");
      hasSentStartTimer = true;
    }
  } catch (err) {
    recordBtn.disabled = false;
    statusMsg.innerText = "⚠️ Microphone access denied.";
    console.error("Recording error:", err);
  }
};
</script>

</body>
</html>
